name: sklearn-agent-service

networks:
  agent-net:
    external: false

services:
  app:
    build: .
    image: agent-app:latest

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      QDRANT_URL: http://qdrant:6333
      NO_PROXY: localhost,127.0.0.1,qdrant
      no_proxy: localhost,127.0.0.1,qdrant

    networks:
      - agent-net

    depends_on:
      - qdrant

    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1

    ports:
      - "6333:6333"

    volumes:
      - ${QDRANT_STORAGE_PATH:-./qdrant_data_v2}:/qdrant/storage

    networks:
      - agent-net

    restart: unless-stopped
