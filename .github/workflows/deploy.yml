name: Deploy

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          LLM_API_KEY: test-key
          QDRANT_URL: http://localhost:6333
          ENABLE_WEB_SEARCH: "false"
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sklearn-agent-service" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /opt/mentoring/agent-service
            umask 077
            # Configure provider, model and key on the server before manual deployment.
            # Preserve that configuration instead of silently falling back to app defaults.
            if [ ! -s .env ]; then
              echo 'Create /opt/mentoring/agent-service/.env before deployment.' >&2
              exit 1
            fi
            chmod 600 .env
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ steps.image.outputs.name }}:latest
            # Only dangling images; tagged history and volumes are retained.
            docker image prune -f
            docker compose up -d qdrant
            docker rm -f agent-app 2>/dev/null || true
            docker run -d \
              --name agent-app \
              --restart unless-stopped \
              -p 127.0.0.1:8000:8000 \
              --network sklearn-agent-service_agent-net \
              --env-file .env \
              --env QDRANT_URL=http://qdrant:6333 \
              ${{ steps.image.outputs.name }}:latest
            docker logout ghcr.io
